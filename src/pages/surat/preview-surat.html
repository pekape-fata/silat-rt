<!-- src/pages/surat/preview-surat.html -->
<div class="container py-3" style="max-width:520px;">
  <h1 class="fs-5 fw-bold mb-3" style="font-family:var(--font-display);">Preview Surat</h1>

  <div id="preview-card" class="card p-3 mb-3" style="border-radius:var(--radius-card); border-color:var(--color-border);">
    <div class="text-muted small">Memuat data surat...</div>
  </div>

  <div class="d-flex flex-wrap gap-2 mb-2">
    <button id="btn-edit" class="btn btn-outline-secondary flex-fill" style="border-radius:var(--radius-btn);">
      Edit
    </button>
    <button id="btn-unduh" class="btn btn-outline-primary flex-fill" style="border-radius:var(--radius-btn);">
      Unduh PDF
    </button>
    <button id="btn-cetak" class="btn btn-primary flex-fill" style="border-radius:var(--radius-btn);">
      Cetak
    </button>
  </div>
  <div class="d-flex flex-wrap gap-2">
    <button id="btn-kirim-wa" class="btn btn-success flex-fill d-none" style="border-radius:var(--radius-btn);">
      Kirim ke WhatsApp
    </button>
    <button id="btn-hapus" class="btn btn-outline-danger flex-fill d-none" style="border-radius:var(--radius-btn);">
      Hapus
    </button>
  </div>
</div>
