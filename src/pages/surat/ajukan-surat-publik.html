<!-- src/pages/surat/ajukan-surat-publik.html -->
<!-- Halaman PUBLIK — bisa diakses warga tanpa login (revisi 05e) -->
<div class="container py-4" style="max-width:480px;">
  <div class="text-center mb-4">
    <h1 class="fs-4 fw-bold" style="font-family:var(--font-display);">Ajukan Surat Kependudukan</h1>
    <p class="text-muted small">RT 01 / RW 09 — Kel. Purwantoro, Kec. Blimbing, Kota Malang</p>
  </div>

  <form id="form-ajukan-surat" class="card p-3" style="border-radius:var(--radius-card); border-color:var(--color-border);">
    <div class="mb-3">
      <label class="form-label small fw-semibold">Jenis Surat</label>
      <select id="jenis_surat_id" class="form-select" required></select>
    </div>
    <div class="mb-3">
      <label class="form-label small fw-semibold">NIK</label>
      <input id="nik_pemohon" type="text" inputmode="numeric" maxlength="16" class="form-control" placeholder="16 digit NIK" required>
    </div>
    <div class="mb-3">
      <label class="form-label small fw-semibold">Nama Lengkap</label>
      <input id="nama_pemohon" type="text" class="form-control" placeholder="Sesuai KTP" required>
    </div>
    <div class="mb-3">
      <label class="form-label small fw-semibold">Nomor WhatsApp Aktif</label>
      <input id="no_hp_pemohon" type="tel" class="form-control" placeholder="08xxxxxxxxxx" required>
      <div class="form-text">Notifikasi status &amp; perbaikan data akan dikirim ke nomor ini.</div>
    </div>
    <div class="mb-3">
      <label class="form-label small fw-semibold">Keperluan</label>
      <textarea id="keperluan" class="form-control" rows="2" placeholder="Contoh: syarat pembukaan rekening bank" required></textarea>
    </div>

    <div id="alert-box" class="alert d-none small" role="alert"></div>

    <button type="submit" id="btn-simpan" class="btn btn-primary fw-semibold" style="border-radius:var(--radius-btn);">
      Simpan &amp; Ajukan
    </button>
    <div class="text-center text-muted small mt-3">
      Pengajuan akan diverifikasi oleh Sekretaris RT terlebih dahulu.
    </div>
  </form>
</div>
